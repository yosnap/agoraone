name: Informar de un error
description: Algo no funciona como debería.
labels: [error]
body:
  - type: markdown
    attributes:
      value: "Antes de enviar, revisa que no incluyes tokens, claves, rutas personales ni datos de tus perfiles o notas. Los fallos de seguridad van por SECURITY.md, no aquí."
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Describe el error y lo que esperabas que ocurriera.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: "1. Abro la ficha de un perfil\n2. Pulso…\n3. Aparece…"
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Entorno
      placeholder: "macOS 15 · Node 22.12 · Hermes 0.21 · Chrome 141"
    validations:
      required: true
  - type: textarea
    id: registros
    attributes:
      label: Registros o capturas (revisados)
      description: Opcional. Elimina antes cualquier dato personal.
