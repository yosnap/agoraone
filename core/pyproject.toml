[project]
name = "agora-core"
version = "1.7.0-alpha.55"
description = "Núcleo local de AgoraOne: cerebro, asistente y complementos. Solo escucha en loopback detrás del backend."
requires-python = "==3.13.*"
license = "MIT"
dependencies = [
    "anthropic>=0.70",
    "claude-agent-sdk>=0.2.181",
    "cryptography>=44",
    "fastapi>=0.115",
    "httpx>=0.27",
    "keyring>=25",
    "mcp>=2.3,<3",
    "numpy>=2.1",
    "openpyxl>=3.1.5",
    "pyobjc-framework-contacts>=11",
    "pyobjc-framework-eventkit>=11",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
    "segno>=1.6.6",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Starlette recommends a different HTTP client for its test client; httpx stays until that one is vetted.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
