[project]
name = "agora-core"
version = "1.0.0a1"
description = "Núcleo local de AgoraOne: cerebro, asistente y complementos. Solo escucha en loopback detrás del backend."
requires-python = "==3.13.*"
license = "MIT"
dependencies = [
    "cryptography>=44",
    "fastapi>=0.115",
    "keyring>=25",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Starlette recommends a different HTTP client for its test client; httpx stays until that one is vetted.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
